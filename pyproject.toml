[project]
name = "Driftwatch"
version = "0.1.0"
description = "Detect upstream API drift, find the code it breaks, ship a verified patch."
readme = "readme.md"
authors = [{ name = "Bilal", email = "khanbilal080804@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23",
    "pydantic>=2.9",
    "httpx2>=2.16.0",
    "typer>=0.15",
    "orjson>=3.10",
    "PyJWT[crypto]>=2.9",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "rich>=13.9",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
driftwatch = "Driftwatch.Cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "Driftwatch"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option() in a default is the framework's intended idiom, not a mutable default.
"src/Driftwatch/Cli.py" = ["B008"]
# Long lines in these modules are tree-sitter query strings, which cannot be wrapped.
"src/Driftwatch/Mapping/SdkPython.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["Test*.py"]
markers = ["integration: tests requiring a real PostgreSQL service"]
# tests/fixtures/sampleRepo is scan input, not a test suite: it ships a deliberately
# unimportable test file so that test-runner detection has something realistic to find.
norecursedirs = ["tests/fixtures"]
