[project]
name = "driftwatch"
version = "0.1.0"
description = "Detect upstream API drift, find the code it breaks, ship a verified patch."
readme = "README.md"
authors = [{ name = "Bilal", email = "khanbilal080804@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23",
    "pydantic>=2.9",
    "httpx>=0.27",
    "typer>=0.15",
    "orjson>=3.10",
    "rich>=13.9",
]

[project.scripts]
driftwatch = "driftwatch.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option() in a default is the framework's intended idiom, not a mutable default.
"src/driftwatch/cli.py" = ["B008"]
# Long lines in these modules are tree-sitter query strings, which cannot be wrapped.
"src/driftwatch/mapping/sdk_python.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/fixtures/sample_repo is scan input, not a test suite: it ships a deliberately
# unimportable test file so that test-runner detection has something realistic to find.
norecursedirs = ["tests/fixtures"]
